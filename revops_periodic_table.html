<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevOps Capability Framework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11;
  --surface: #16181c;
  --surface-2: #1e2026;
  --border: #2a2d35;
  --border-2: #353840;
  --text: #f0ede8;
  --text-2: #9a9893;
  --text-3: #5a5a56;

  --now-bg: #0d2b20;
  --now-border: #1d9e75;
  --now-text: #6eddb8;
  --now-label: #1d9e75;

  --build-bg: #2b1e08;
  --build-border: #ba7517;
  --build-text: #f5c06a;
  --build-label: #ba7517;

  --future-bg: #1a1b2e;
  --future-border: #4a4f8a;
  --future-text: #8b92d4;
  --future-label: #6069c8;

  --col-systems-h: #1d9e75;
  --col-revenue-h: #185fa5;
  --col-lifecycle-h: #ba7517;
  --col-growth-h: #7c3aed;
  --col-data-h: #64748b;
  --col-tod-h: #993556;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  padding: 32px 32px 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.header-left {}

.org-tag {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 10px;
}

h1 {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}

.header-sub {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
  max-width: 480px;
}

.legend {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  padding-top: 4px;
}

.leg {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-family: 'Space Mono', monospace;
  letter-spacing: .5px;
}

.leg-pip {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── TABLE ── */
.table-wrap {
  padding: 24px 32px;
  overflow-x: auto;
}

.pt-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  min-width: 860px;
}

/* Column headers */
.col-header {
  padding: 10px 10px 9px;
  border-radius: 6px;
  margin-bottom: 2px;
}

.col-header-name {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  line-height: 1.3;
  margin-bottom: 3px;
}

.col-header-desc {
  font-size: 9px;
  opacity: 0.65;
  line-height: 1.35;
}

/* Cells */
.cell {
  border-radius: 5px;
  padding: 9px 9px 8px;
  cursor: pointer;
  border: 1px solid;
  transition: transform 0.12s, box-shadow 0.12s;
  min-height: 72px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
}

.cell:hover {
  transform: translateY(-2px);
  z-index: 2;
}

.cell.active {
  box-shadow: 0 0 0 2px var(--text) !important;
  z-index: 3;
}

.cell-code {
  font-family: 'Space Mono', monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .5px;
  opacity: 0.55;
  margin-bottom: 3px;
}

.cell-name {
  font-size: 10px;
  font-weight: 500;
  line-height: 1.3;
  flex: 1;
}

.cell-badge {
  font-family: 'Space Mono', monospace;
  font-size: 7px;
  letter-spacing: .4px;
  text-transform: uppercase;
  margin-top: 6px;
  opacity: 0.8;
}

/* Status variants */
.s-now   { background: var(--now-bg);    border-color: var(--now-border);    color: var(--now-text); }
.s-build { background: var(--build-bg);  border-color: var(--build-border);  color: var(--build-text); }
.s-future{ background: var(--future-bg); border-color: var(--future-border); color: var(--future-text); border-style: dashed; }

/* ── DETAIL PANEL ── */
.detail-panel {
  margin: 0 32px 32px;
  background: var(--surface);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  overflow: hidden;
  min-height: 200px;
}

.detail-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 1px;
}

.detail-inner {
  display: none;
}

.detail-inner.show {
  display: block;
}

.detail-top {
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  gap: 16px;
}

.detail-badge {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .5px;
  flex-shrink: 0;
  text-align: center;
  line-height: 1.2;
  border: 1px solid;
}

.detail-meta { flex: 1; }

.detail-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
  line-height: 1.2;
}

.detail-col {
  font-size: 11px;
  color: var(--text-2);
  margin-bottom: 5px;
}

.detail-status {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 3px;
  display: inline-block;
}

.detail-desc {
  padding: 14px 22px;
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.65;
  border-bottom: 1px solid var(--border);
}

.subs-grid {
  padding: 14px 22px 18px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 7px;
}

.sub-item {
  background: var(--surface-2);
  border-radius: 5px;
  padding: 9px 11px;
  border-left: 2px solid;
}

.sub-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}

.sub-desc {
  font-size: 10px;
  color: var(--text-2);
  line-height: 1.4;
}

.sub-tag {
  font-family: 'Space Mono', monospace;
  font-size: 8px;
  letter-spacing: .3px;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 2px;
  display: inline-block;
  margin-top: 4px;
  opacity: 0.8;
}

.detail-backlog {
  padding: 10px 22px 16px;
  border-top: 1px solid var(--border);
}

.backlog-label {
  font-family: 'Space Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 7px;
}

.backlog-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.backlog-chip {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 3px;
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
}

/* Col header colors */
.ch-systems { background: #0d2b20; border-left: 3px solid var(--col-systems-h); }
.ch-revenue  { background: #0a1e35; border-left: 3px solid var(--col-revenue-h); }
.ch-lifecycle{ background: #2b1e08; border-left: 3px solid var(--col-lifecycle-h); }
.ch-growth   { background: #1a1028; border-left: 3px solid var(--col-growth-h); }
.ch-data     { background: #141a22; border-left: 3px solid var(--col-data-h); }
.ch-tod      { background: #200d15; border-left: 3px solid var(--col-tod-h); }

.ch-systems  .col-header-name { color: #6eddb8; }
.ch-revenue  .col-header-name { color: #7eb8f5; }
.ch-lifecycle .col-header-name { color: #f5c06a; }
.ch-growth   .col-header-name { color: #b58af5; }
.ch-data     .col-header-name { color: #94a3c0; }
.ch-tod      .col-header-name { color: #e890b5; }

@media (max-width: 900px) {
  .header { padding: 20px 20px 0; }
  .table-wrap { padding: 16px 20px; }
  .detail-panel { margin: 0 20px 24px; }
}
</style>
</head>

const grid = document.getElementById('grid');
const detailPanel = document.getElementById('detailPanel');
const detailEmpty = document.getElementById('detailEmpty');
const detailInner = document.getElementById('detailInner');

// Build column headers + cells
COLS.forEach(col => {
  // Header
  const hdr = document.createElement('div');
  hdr.className = `col-header ${col.cls}`;
  hdr.innerHTML = `<div class="col-header-name">${col.name.replace('\n','<br>')}</div><div class="col-header-desc">${col.desc}</div>`;
  grid.appendChild(hdr);
});

// Find max rows
const maxRows = Math.max(...COLS.map(c => c.cells.length));

for (let r = 0; r < maxRows; r++) {
  COLS.forEach(col => {
    const cell = col.cells[r];
    if (!cell) {
      const empty = document.createElement('div');
      empty.style.minHeight = '72px';
      grid.appendChild(empty);
      return;
    }
    const st = S[cell.s];
    const el = document.createElement('div');
    el.className = `cell s-${cell.s}`;
    el.innerHTML = `
      <div class="cell-code">${cell.code}</div>
      <div class="cell-name">${cell.name.replace('\n','<br>')}</div>
      <div class="cell-badge">${st.label}</div>`;
    el.addEventListener('click', () => showDetail(cell, col, el));
    grid.appendChild(el);
  });
}

function showDetail(cell, col, cellEl) {
  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
  cellEl.classList.add('active');

  const st = S[cell.s];

  const subsHtml = cell.subs.map(sub => {
    const ss = S[sub.s];
    return `<div class="sub-item" style="border-left-color:${ss.border}">
      <div class="sub-name">${sub.n}</div>
      <div class="sub-desc">${sub.d}</div>
      <div class="sub-tag" style="background:${ss.tagBg};color:${ss.tagText}">${ss.label}</div>
    </div>`;
  }).join('');

  const backlogHtml = cell.ex && cell.ex.length ? `
    <div class="detail-backlog">
      <div class="backlog-label">From your backlog today</div>
      <div class="backlog-chips">${cell.ex.map(e => `<span class="backlog-chip">${e}</span>`).join('')}</div>
    </div>` : '';

  detailInner.innerHTML = `
    <div class="detail-top">
      <div class="detail-badge s-${cell.s}" style="border-color:${st.border};color:${st.text}">${cell.code}</div>
      <div class="detail-meta">
        <div class="detail-title">${cell.name.replace('\n',' ')}</div>
        <div class="detail-col">${col.name.replace('\n',' ')}</div>
        <div class="detail-status" style="background:${st.tagBg};color:${st.tagText}">${st.label}</div>
      </div>
    </div>
    <div class="detail-desc">${cell.desc}</div>
    <div class="subs-grid">${subsHtml}</div>
    ${backlogHtml}`;

  detailEmpty.style.display = 'none';
  detailInner.classList.add('show');
}
